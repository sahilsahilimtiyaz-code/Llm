name: Build Android LocalCore AI APK (arm64-v8a + Vulkan)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile libllama.so (Vulkan/NEON) & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22 (Build WebView UI Bundle)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build production WebView UI assets
        run: |
          npm ci
          npm run build
          mkdir -p android-project/app/src/main/assets/webview
          cp -r dist/* android-project/app/src/main/assets/webview/
          mkdir -p android-project/app/src/main/assets/python-engine
          cp -r android-project/python-engine/* android-project/app/src/main/assets/python-engine/

      - name: Set up Android SDK & NDK r27c
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Install Vulkan headers & glslc shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc ninja-build

      - name: Cross-compile llama.cpp for Android arm64-v8a (Vulkan + ARM NEON/dotprod/i8mm)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-android-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod+i8mm" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+i8mm"
          cmake --build /tmp/llama-android-build --target llama --parallel $(nproc)
          mkdir -p android-project/app/src/main/jniLibs/arm64-v8a
          cp /tmp/llama-android-build/bin/*.so android-project/app/src/main/jniLibs/arm64-v8a/ || \
          find /tmp/llama-android-build -name "*.so" -exec cp {} android-project/app/src/main/jniLibs/arm64-v8a/ \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode Release Keystore (if configured in repository secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV

      - name: Build Debug & Release APKs
        working-directory: android-project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact (Instant Download on Every Push)
        uses: actions/upload-artifact@v4
        with:
          name: LocalCoreAI-arm64-v8a-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Signed Release APK Artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LocalCoreAI-arm64-v8a-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Publish GitHub Release APK on Version Tags (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-project/app/build/outputs/apk/debug/*.apk
            android-project/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
